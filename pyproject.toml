[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termassist"
version = "1.0.0"
description = "Terminal AI Command Assistant - 智能终端命令助手"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "TermAssist Team", email = "termassist@example.com"}
]
keywords = ["terminal", "ai", "cli", "command", "assistant", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.8.0",
    "click>=8.0.0",
    "prompt-toolkit>=3.0.0",
    "pyperclip>=1.8.0",
]

[project.scripts]
termassist = "termassist.main:main"
tai = "termassist.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/termassist"
Repository = "https://github.com/yourusername/termassist"
Issues = "https://github.com/yourusername/termassist/issues"
